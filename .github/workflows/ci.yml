name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy transformers pytest ruff

      - name: Lint (ruff)
        run: ruff check open_mythos tests

      - name: Run tests
        # Skip benchmark scripts (compare against a reference transformer) and
        # the tokenizer tests (they download a multi-GB HF tokenizer over the
        # network — not hermetic unit tests).
        run: >-
          pytest tests -q
          --ignore=tests/bench_vs_transformer.py
          --ignore=tests/small_benchmark.py
          --ignore=tests/test_tokenizer.py
